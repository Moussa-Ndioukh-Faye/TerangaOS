# =============================================================================
# TérangaOS - Syslinux Configuration
# Codename: Djolof
# =============================================================================

UI vesamenu.c32
MENU TITLE TérangaOS 1.0 Djolof
MENU BACKGROUND ../terangaos.png
MENU COLOR border       30;44   #40ffffff #00000000 std
MENU COLOR title       1;36   #c0ffffff #00000000 std
MENU COLOR timeout     1;37   #10ffffff #00000000 std
MENU COLOR msg         1;37   #10ffffff #00000000 std
MENU COLOR timeout_msg  1;37   #80ffffff #00000000 std
MENU COLOR tabmsg      1;37   #30ffffff #00000000 std
MENU COLOR help        1;37   #c0ffffff #00000000 std
MENU COLOR timeout_msg 1;37   #80ffffff #00000000 std
MENU COLOR msg07      1;37   #90ffffff #00000000 std
MENU COLOR tabmsg      1;37   #30ffffff #00000000 std

LABEL terangaos
    MENU LABEL TérangaOS 1.0 (Djolof) - Live
    MENU DEFAULT
    LINUX /live/vmlinuz
    INITRD /live/initrd.img
    APPEND boot=live components locales=fr_FR.UTF-8 keyboard-layouts=fr timezone=Africa/Dakar

LABEL memtest
    MENU LABEL Memtest86+
    LINUX /memtest86+

LABEL hd
    MENU LABEL ═══════════════════════════
    MENU HIDE

PROMPT 0
TIMEOUT 50
ONTIMEONLY 0