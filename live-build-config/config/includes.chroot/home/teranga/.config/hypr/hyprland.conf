# TérangaOS — Hyprland Configuration
# Codename: Djolof | ESP/UCAD Dakar

monitor=,preferred,auto,1

exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = udiskie -t
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = MOZ_ENABLE_WAYLAND,1

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(FFBE00ff) rgba(C85200ff) 45deg
    col.inactive_border = rgba(1A1408aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 3
    }
    drop_shadow = true
    shadow_range = 20
    col.shadow = rgba(FFBE0022)
    active_opacity = 1.0
    inactive_opacity = 0.92
}

animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, overshot, slide
    animation = windowsOut, 1, 7, overshot, slide
    animation = fade, 1, 7, overshot
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

input {
    kb_layout = fr
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

$mainMod = SUPER
$terminal = kitty
$menu = wofi --show drun

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, thunar
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreen, 0

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod, left, workspace, e+1
bind = $mainMod, right, workspace, e-1

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$

layerrule = ignorezero, waybar
layerrule = ignorezero, notifications

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}