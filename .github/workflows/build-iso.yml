name: TérangaOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: "Variante à construire"
        type: choice
        options: [core, cyber, full]
        default: core

jobs:
  lint:
    name: Vérification des scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntaxe bash
        run: |
          for f in build.sh build-docker.sh clean.sh config/hooks/*/*.hook.chroot \
                   config/includes.chroot/usr/local/bin/teranga-*; do
            bash -n "$f" && echo "OK $f"
          done

      - name: ShellCheck
        run: |
          shellcheck -S warning build.sh build-docker.sh clean.sh \
            config/hooks/*/*.hook.chroot config/includes.chroot/usr/local/bin/teranga-*

      - name: Hooks exécutables
        run: |
          bad=$(find config/hooks config/includes.chroot/usr/local/bin config/includes.chroot/usr/lib/live -type f ! -perm -u+x)
          if [ -n "$bad" ]; then echo "Fichiers non exécutables :"; echo "$bad"; exit 1; fi

  iso:
    name: ISO ${{ inputs.variant || 'core' }}
    # Build complet uniquement à la demande (onglet Actions > Run workflow)
    # ou sur main, pour ne pas lancer 1 h de build à chaque pull request.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Construire l'ISO
        run: ./build-docker.sh --variant "${{ inputs.variant || 'core' }}"

      - name: Publier l'ISO
        uses: actions/upload-artifact@v4
        with:
          name: terangaos-${{ inputs.variant || 'core' }}-iso
          path: |
            build/terangaos-*.iso
            build/terangaos-*.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publier le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.variant || 'core' }}
          path: build/build-*.log
          retention-days: 7
          if-no-files-found: ignore
