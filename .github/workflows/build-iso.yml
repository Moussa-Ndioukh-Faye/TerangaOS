name: Build TerangaOS ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            git \
            curl \
            wget \
            build-essential \
            squashfs-tools \
            genisoimage \
            syslinux \
            isolinux

      - name: Clean completely
        run: |
          rm -rf live-build-config/*

      - name: Configure fresh
        run: |
          cd live-build-config
          sudo lb config \
            --distribution bookworm \
            --parent-mirror-bootstrap http://deb.debian.org/debian \
            --parent-mirror-chroot http://deb.debian.org/debian \
            --parent-mirror-binary http://deb.debian.org/debian \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootloader syslinux \
            --iso-volume TerangaOS \
            --debian-installer false

      - name: Create minimal package list
        run: |
          mkdir -p live-build-config/config/package-lists
          echo -e "systemd\nsystemd-sysv\ndbus\nnetwork-manager\ncurl\nwget\ngit" > live-build-config/config/package-lists/base.list.chroot

      - name: Build
        run: |
          cd live-build-config
          sudo lb build --verbose 2>&1 | tee build.log

      - name: Show build result
        run: |
          echo "=== Build status ==="
          ls -la live-build-config/*.iso 2>/dev/null || echo "No ISO found"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: terangaos-iso
          path: live-build-config/*.iso
          retention-days: 30
          if-no-files-found: warn

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: live-build-config/build.log
          retention-days: 7