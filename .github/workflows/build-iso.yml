name: Build TerangaOS ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            git \
            curl \
            wget \
            build-essential \
            fuse \
            libfuse2 \
            squashfs-tools \
            genisoimage \
            syslinux \
            isolinux

      - name: Clean previous build
        run: |
          rm -rf live-build-config/config
          rm -rf live-build-config/chroot
          rm -f live-build-config/*.iso
          rm -f live-build-config/build.log

      - name: Configure live-build
        run: |
          cd live-build-config
          sudo lb config \
            --distribution bookworm \
            --parent-mirror-bootstrap http://deb.debian.org/debian \
            --parent-mirror-chroot http://deb.debian.org/debian \
            --parent-mirror-binary http://deb.debian.org/debian \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootloader syslinux \
            --iso-volume "TerangaOS"

      - name: Build ISO
        run: |
          cd live-build-config
          sudo lb build --verbose 2>&1 | tee build.log
          echo "=== BUILD COMPLETE ==="
          ls -la *.iso 2>/dev/null || echo "ISO NOT FOUND"

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -100 live-build-config/build.log

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terangaos-iso
          path: live-build-config/*.iso
          retention-days: 30