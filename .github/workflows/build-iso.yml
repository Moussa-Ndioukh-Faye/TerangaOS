name: Build TerangaOS ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            git \
            curl \
            wget \
            build-essential \
            squashfs-tools \
            genisoimage \
            syslinux \
            isolinux \
            xorriso

      - name: Check disk space
        run: df -h

      - name: Clean build directory
        run: |
          cd live-build-config
          sudo lb clean --purge || true
          cd ..
          rm -rf live-build-config/.build
          rm -rf live-build-config/chroot
          rm -f live-build-config/*.iso
          rm -f live-build-config/*.log

      - name: Configure live-build
        run: |
          cd live-build-config
          sudo lb config \
            --distribution bookworm \
            --parent-mirror-bootstrap http://deb.debian.org/debian \
            --parent-mirror-chroot http://deb.debian.org/debian \
            --parent-mirror-binary http://deb.debian.org/debian \
            --parent-mirror-chroot-security http://security.debian.org/debian-security \
            --parent-mirror-binary-security http://security.debian.org/debian-security \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootloader syslinux \
            --iso-volume TERANGOS \
            --debian-installer false \
            --archive-area main \
            --cache yes \
            --verbose

      - name: Verify config
        run: |
          echo "=== Checking config ==="
          ls -la live-build-config/config/
          if [ -d live-build-config/config/package-lists ]; then
            ls -la live-build-config/config/package-lists/
            cat live-build-config/config/package-lists/*.list.chroot || echo "No list files"
          fi

      - name: Build ISO
        run: |
          cd live-build-config
          sudo lb build --verbose 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "ERROR: Build failed with status $BUILD_STATUS"
            echo "=== Last 100 lines of build log ==="
            tail -n 100 build.log
            exit $BUILD_STATUS
          fi

      - name: Check output
        run: |
          echo "=== Checking for ISO ==="
          ISO_FILE=$(find live-build-config -name "*.iso" -type f | head -n 1)
          if [ -n "$ISO_FILE" ]; then
            echo "Found ISO: $ISO_FILE"
            ls -lh "$ISO_FILE"
          else
            echo "ERROR: No ISO file generated"
            echo "=== Directory contents ==="
            ls -la live-build-config/
            ls -la live-build-config/binary/ || echo "Binary directory not found"
            exit 1
          fi

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: terangaos-iso
          path: |
            live-build-config/*.iso
            live-build-config/binary*.iso
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: live-build-config/build.log
          retention-days: 7