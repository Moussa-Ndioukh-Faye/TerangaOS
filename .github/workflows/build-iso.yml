name: Build TerangaOS ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            git \
            curl \
            wget \
            build-essential \
            fuse \
            libfuse2 \
            squashfs-tools \
            genisoimage \
            syslinux \
            isolinux

      - name: Clean previous build
        run: |
          rm -rf live-build-config/config
          rm -rf live-build-config/chroot
          rm -rf live-build-config/temp
          rm -f live-build-config/*.iso
          rm -f live-build-config/*.log

      - name: Configure live-build
        run: |
          cd live-build-config
          sudo lb config --distribution bookworm --parent-mirror-bootstrap http://deb.debian.org/debian --parent-mirror-chroot http://deb.debian.org/debian --parent-mirror-binary http://deb.debian.org/debian --architectures amd64 --binary-images iso-hybrid --bootloader syslinux --iso-volume TerangaOS

      - name: Build ISO
        run: |
          cd live-build-config
          sudo lb build --verbose 2>&1 || echo "Build exit code: $?"

      - name: Show last 50 lines of build
        run: |
          tail -50 live-build-config/build.log

      - name: Find ISO
        run: |
          echo "=== Looking for ISO ==="
          ls -la live-build-config/*.iso 2>/dev/null
          ls -la live-build-config/binary/*.iso 2>/dev/null
          ls -la live-build-config/image* 2>/dev/null
          find live-build-config -maxdepth 1 -name "*.iso" 2>/dev/null
          echo "=== All files in live-build-config ==="
          sudo find live-build-config -maxdepth 1 -type f 2>/dev/null | head -20