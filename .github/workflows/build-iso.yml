name: Build TerangaOS ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            git \
            curl \
            wget \
            build-essential \
            squashfs-tools \
            genisoimage \
            syslinux \
            isolinux \
            xorriso

      - name: Clean build directory
        run: |
          rm -rf live-build-config/.build
          rm -rf live-build-config/chroot
          rm -rf live-build-config/temp
          rm -f live-build-config/*.iso
          rm -f live-build-config/*.log

      - name: Configure live-build
        run: |
          cd live-build-config
          sudo lb config \
            --distribution bookworm \
            --parent-mirror-bootstrap http://deb.debian.org/debian \
            --parent-mirror-chroot http://deb.debian.org/debian \
            --parent-mirror-binary http://deb.debian.org/debian \
            --parent-mirror-chroot-security http://security.debian.org/debian-security \
            --parent-mirror-binary-security http://security.debian.org/debian-security \
            --architectures amd64 \
            --binary-images iso-hybrid \
            --bootloader syslinux \
            --iso-volume TERANGOS \
            --debian-installer false \
            --archive-area main

      - name: Verify config
        run: |
          echo "=== Checking config ==="
          ls -la live-build-config/config/
          cat live-build-config/config/package-lists/base.list.chroot

      - name: Build ISO
        run: |
          cd live-build-config
          sudo lb build 2>&1 | tee build.log

      - name: Check output
        run: |
          echo "=== Checking for ISO ==="
          find live-build-config -name "*.iso" -type f 2>/dev/null
          ls -la live-build-config/*.iso 2>/dev/null || echo "No ISO in root"
          ls -la live-build-config/binary 2>/dev/null || echo "No binary dir"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: terangaos-iso
          path: |
            live-build-config/*.iso
            live-build-config/binary*.iso
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: live-build-config/build.log
          retention-days: 7