[Theme]
Current=debian-elarun
Background=/usr/share/backgrounds/terangaos/teranga-wallpaper.png
CursorSize=24

[General]
Type=Wayland
SessionDir=/usr/share/xsessions:/usr/share/wayland-sessions
RebootCommand=systemctl reboot
HaltCommand=systemctl poweroff

[_users]
# Default user
DefaultUser=teranga
# Hide autologin user
HideUsers=False