# TérangaOS — réglages de performance
# (les anciens réglages kernel.sched_* ont été retirés : ils n'existent plus
#  depuis Linux 5.13 et provoquaient des erreurs au démarrage)
# Avec zram (swap en RAM compressée), une valeur élevée est recommandée
vm.swappiness = 100
vm.vfs_cache_pressure = 50
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
