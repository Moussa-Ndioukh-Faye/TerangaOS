# TérangaOS — Hyprlock (écran de verrouillage)

background {
    monitor =
    path = /usr/share/backgrounds/terangaos/djolof.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    noise = 0.0117
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(FFBE0088)
    inner_color = rgba(0a070299)
    font_color = rgba(F5EDD8ff)
    fade_on_empty = true
    placeholder_text = <i>Mot de passe...</i>
    hide_input = false
    check_color = rgba(4FFFAA88)
    fail_color = rgba(FF6B6B88)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(FFBE00ee)
    font_size = 90
    font_family = Playfair Display Bold
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A %d %B %Y')"
    color = rgba(F5EDD888)
    font_size = 18
    font_family = Syne
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = TérangaOS 1.0 — Djolof
    color = rgba(F5EDD844)
    font_size = 12
    font_family = JetBrains Mono
    position = 0, -200
    halign = center
    valign = center
}
