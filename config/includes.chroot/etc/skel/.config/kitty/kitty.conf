# TérangaOS — Kitty Terminal Configuration

font_family JetBrains Mono
font_size 12
bold_font auto
italic_font auto
bold_italic_font auto

# Window
window_padding_width 8
window_margin_width 0
window_border_width 2
window_opacity 0.95

# Scrollback
scrollback_lines 10000
repaint_delay 10

# Mouse
copy_on_select yes
strip_trailing_spaces always

# Cursor
cursor_shape block
cursor_blink_interval 0

# URL
detect_urls yes
url_color #4FFFAA

# Colors (Djolof Theme)
foreground #F5EDD8
background #0A0702
selection_background #FFBE00
selection_foreground #0A0702

color0 #0A0702
color1 #C85200
color2 #4FFFAA
color3 #FFBE00
color4 #7EC8FF
color5 #FF7A30
color6 #4FFFAA
color7 #F5EDD8
color8 #1A1408
color9 #C85200
color10 #4FFFAA
color11 #FFBE00
color12 #7EC8FF
color13 #FF7A30
color14 #4FFFAA
color15 #F5EDD8

# Tab bar
tab_bar_edge top
tab_bar_background #1A1408
tab_bar_active_background #FFBE00
tab_bar_active_foreground #0A0702

# Bell
enable_audio_bell no
visual_bell_duration 0

# Performance
 repaint_delay 10
 input_delay 3
 sync_to_decide 0